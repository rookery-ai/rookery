version: 2

project_name: rookery

before:
  hooks:
    # The SPA must exist before the Go build, because it is embedded. A clean
    # checkout only has dist/.gitkeep, which keeps `go build` working but would
    # ship a binary with no UI.
    - npm --prefix web/ui ci
    - npm --prefix web/ui run build

builds:
  - id: rookery
    main: ./cmd/rookery
    binary: rookery
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ilijad1/rookery/internal/buildinfo.Version={{.Version}}
      - -X github.com/ilijad1/rookery/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/ilijad1/rookery/internal/buildinfo.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - packaging/README.md
      - packaging/systemd/rookery.service

nfpms:
  - id: packages
    package_name: rookery
    vendor: Ilija Dimitrovski
    homepage: https://github.com/ilijad1/rookery
    maintainer: Ilija Dimitrovski <ilija.dimitrovski@kroute.ai>
    description: |
      Multi-workspace AI agents control plane with a built-in knowledge base,
      connector layer and scheduler.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      # Shipped to /usr/share rather than installed into ~/.config: a package
      # must not write into a user's home directory, and the unit is per-user.
      - src: packaging/systemd/rookery.service
        dst: /usr/share/rookery/rookery.service
      - src: packaging/README.md
        dst: /usr/share/doc/rookery/README.md
    # These make the difference between a working install and a mystifying one.
    # python3 in particular: without it the agent-tool AST guardrail self-skips.
    #
    # The names differ between distributions and MUST be declared per format.
    # A single list here shipped the Debian spelling to both, and Fedora has no
    # package called tesseract-ocr — its package is tesseract. dnf drops a weak
    # dependency it cannot resolve without saying anything, so an rpm install
    # produced rookery and ripgrep, no OCR, and no error to explain it.
    # scripts/smoke-package.sh asserts the resolved names per format.
    recommends:
      - python3
      - ripgrep
      - poppler-utils
      - tesseract-ocr
    overrides:
      rpm:
        recommends:
          - python3
          - ripgrep
          - poppler-utils
          - tesseract

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  # Keyless: the certificate is issued against the workflow's OIDC identity, so
  # there is no private key to store or rotate.
  #
  # Emits a single Sigstore BUNDLE rather than separate .sig/.pem files. cosign
  # v3 (what sigstore/cosign-installer installs) defaults to the new bundle
  # format, under which --output-signature/--output-certificate are deprecated
  # AND IGNORED — cosign then tries to write a bundle to the empty path it was
  # never given, and v0.1.0 died exactly there:
  #   Error: signing dist/checksums.txt: create bundle file: open : no such file
  # The bundle carries the signature and the certificate together, so nothing is
  # lost; the verify command in the release footer below changes to match.
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  # release-please owns the changelog; goreleaser must not write a second one.
  disable: true

release:
  draft: false
  prerelease: auto
  footer: |
    ## Verifying this release

    ```bash
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.bundle \
      --certificate-identity-regexp 'https://github\.com/ilijad1/rookery/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

    ## Installing

    See `packaging/README.md` in the archive, or install the `.deb`/`.rpm` and
    follow `/usr/share/doc/rookery/README.md`.
