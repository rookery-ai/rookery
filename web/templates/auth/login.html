{{template "head" .}}

<div class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="card w-full max-w-md shadow-2xl bg-base-100">
    <div class="card-body">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold">⚡ Simple Agents</h1>
        <p class="text-base-content/60 mt-1">Sign in to your account</p>
      </div>

      {{template "alert" .}}

      <form method="POST" action="/login" class="space-y-4">
        <div class="form-control">
          <label class="label"><span class="label-text">Username</span></label>
          <input type="text" name="username" placeholder="your-username"
            class="input input-bordered w-full" required autofocus autocomplete="username">
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password" name="password" placeholder="••••••••"
            class="input input-bordered w-full" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-full">Sign In</button>
      </form>
    </div>
  </div>
</div>

{{template "foot" .}}
