{{template "head" .}}

<div class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="card w-full max-w-md shadow-2xl bg-base-100">
    <div class="card-body">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold">🔑 Change Password</h2>
        <p class="text-base-content/60 mt-1">You must set a new password before continuing</p>
      </div>

      {{template "alert" .}}

      <form method="POST" action="/change-password" class="space-y-4">
        <div class="form-control">
          <label class="label"><span class="label-text">New Password</span></label>
          <input type="password" name="password" placeholder="At least 8 characters"
            class="input input-bordered w-full" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Confirm Password</span></label>
          <input type="password" name="confirm" placeholder="Repeat your new password"
            class="input input-bordered w-full" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary w-full">Set New Password</button>
      </form>
    </div>
  </div>
</div>

{{template "foot" .}}
