{{template "head" .}}

<div class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-4xl mb-3">🔑</div>
      <h1 class="text-2xl font-bold">Change Password</h1>
      <p class="text-base-content/50 text-sm mt-1">You must set a new password before continuing</p>
    </div>

    <div class="card bg-base-100 shadow-xl border border-base-300">
      <div class="card-body gap-4">
        {{template "alert" .}}

        <form method="POST" action="/change-password" class="space-y-4">
          <div class="form-control">
            <label class="label pb-1"><span class="label-text font-medium">New Password</span></label>
            <input type="password" name="password" placeholder="At least 8 characters"
              class="input input-bordered w-full" required minlength="8"
              autocomplete="new-password" id="pw-input">
            <label class="label pt-1">
              <span class="label-text-alt text-base-content/40">Minimum 8 characters</span>
            </label>
          </div>
          <div class="form-control">
            <label class="label pb-1"><span class="label-text font-medium">Confirm Password</span></label>
            <input type="password" name="confirm" placeholder="Repeat your new password"
              class="input input-bordered w-full" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary w-full">Set New Password</button>
        </form>
      </div>
    </div>
  </div>
</div>

{{template "foot" .}}
