{{template "head" .}}
{{template "navbar" .}}

<div class="container mx-auto px-4 py-8 max-w-3xl">
  {{template "alert" .}}

  <div class="text-sm breadcrumbs mb-3">
    <ul>
      <li><a href="/dashboard/kb">🏠 Vault</a></li>
      {{if .ParentPath}}<li><a href="/dashboard/kb?path={{.ParentPath}}">{{.ParentPath}}</a></li>{{end}}
      <li>Edit</li>
    </ul>
  </div>

  <h1 class="text-xl font-bold mb-4">✏️ {{if .Path}}{{.Path}}{{else}}New note{{end}}</h1>

  <form method="POST" action="/dashboard/kb/save" class="space-y-3">
    <div class="form-control">
      <label class="label py-1"><span class="label-text text-sm">Path (relative to your vault)</span></label>
      <input type="text" name="path" value="{{.Path}}" placeholder="notes/my-note.md"
        class="input input-bordered input-sm w-full font-mono" required {{if .Path}}readonly{{end}}>
    </div>
    <div class="form-control">
      <textarea name="content"
        class="textarea textarea-bordered w-full font-mono text-sm leading-relaxed resize-y"
        style="min-height:420px;" spellcheck="false"
        placeholder="# Title&#10;&#10;Write markdown here. Link other notes with [[Note Name]].">{{.Content}}</textarea>
    </div>
    <div class="flex justify-between items-center">
      <p class="text-xs text-base-content/30">Link notes with <code>[[Note Name]]</code>. Markdown supported.</p>
      <div class="flex gap-2">
        {{if .Path}}<a href="/dashboard/kb/view?path={{.Path}}" class="btn btn-ghost btn-sm">Cancel</a>{{end}}
        <button type="submit" class="btn btn-primary btn-sm">Save</button>
      </div>
    </div>
  </form>
</div>

{{template "foot" .}}
