{{template "head" .}}
{{template "navbar" .}}

<div class="container mx-auto px-4 py-8 max-w-2xl">
  {{template "alert" .}}

  <div class="flex items-center gap-2 mb-6">
    <a href="/dashboard/agents" class="btn btn-ghost btn-sm">← Agents</a>
    <span class="text-base-content/30">/</span>
    <span class="font-semibold">Import Agent</span>
  </div>

  <div class="card bg-base-100 shadow-sm border border-base-300">
    <div class="card-body">
      <h2 class="card-title">Import MD Agent</h2>
      <p class="text-base-content/50 text-sm mb-4">
        Import an existing CLAUDE.md instruction file as a new agent. Claude will execute the instructions on each run.
      </p>
      <form method="POST" action="/dashboard/agents/import">
        <div class="form-control mb-4">
          <label class="label"><span class="label-text font-medium">Agent name</span></label>
          <input type="text" name="name" placeholder="my-agent" class="input input-bordered" required>
        </div>
        <div class="form-control mb-4">
          <label class="label"><span class="label-text font-medium">Description</span></label>
          <input type="text" name="description" placeholder="What does this agent do?" class="input input-bordered">
        </div>
        <div class="form-control mb-6">
          <label class="label"><span class="label-text font-medium">CLAUDE.md content</span></label>
          <textarea name="content" class="textarea textarea-bordered font-mono text-xs h-80" placeholder="Paste your CLAUDE.md content here..." required></textarea>
        </div>
        <div class="flex gap-2 justify-end">
          <a href="/dashboard/agents" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">Import Agent</button>
        </div>
      </form>
    </div>
  </div>
</div>

{{template "foot" .}}
