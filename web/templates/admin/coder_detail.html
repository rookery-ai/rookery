{{template "head" .}}
{{template "admin_navbar" .}}

<div class="container mx-auto px-4 py-8 max-w-2xl">
  {{template "alert" .}}

  <div class="flex items-center gap-3 mb-6">
    <a href="/admin/coders" class="btn btn-ghost btn-sm">← Back</a>
    <div>
      <h1 class="text-2xl font-bold">{{.Coder.Name}}</h1>
      <p class="text-base-content/50 text-xs font-mono mt-0.5">ID: {{.Coder.ID}}</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm border border-base-300 mb-6">
    <div class="card-body p-5">
      <h2 class="font-semibold mb-4">Edit Profile</h2>
      <form method="POST" action="/admin/coders/{{.Coder.ID}}" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="form-control">
          <label class="label pb-1"><span class="label-text text-sm">Profile Name</span></label>
          <input type="text" name="name" class="input input-bordered input-sm" value="{{.Coder.Name}}" required>
        </div>
        <div class="form-control">
          <label class="label pb-1"><span class="label-text text-sm">Claude Binary Path</span></label>
          <input type="text" name="claude_bin" class="input input-bordered input-sm font-mono" value="{{.Coder.ClaudeBin}}">
        </div>
        <div class="form-control">
          <label class="label pb-1"><span class="label-text text-sm">Timeout (seconds)</span></label>
          <input type="number" name="timeout_s" class="input input-bordered input-sm" value="{{.Coder.TimeoutS}}" min="10" max="3600">
        </div>
        <div class="form-control">
          <label class="label pb-1"><span class="label-text text-sm">Description</span></label>
          <input type="text" name="description" class="input input-bordered input-sm" value="{{.Coder.Description}}">
        </div>
        <div class="sm:col-span-2 flex gap-2">
          <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm border border-error/30">
    <div class="card-body p-5">
      <h2 class="font-semibold text-error mb-2">Danger Zone</h2>
      <p class="text-sm text-base-content/60 mb-3">Deleting this profile will unassign it from all users (they will fall back to the system default).</p>
      <form method="POST" action="/admin/coders/{{.Coder.ID}}/delete" onsubmit="return confirm('Delete coder profile {{.Coder.Name}}?')">
        <button type="submit" class="btn btn-error btn-sm btn-outline">Delete Profile</button>
      </form>
    </div>
  </div>
</div>

{{template "foot" .}}
