provider: linkedin
actions:
  - name: linkedin_me
    description: "Your own LinkedIn profile: name, email, and the person id other actions need. Read-only. Call this FIRST — linkedin_create_post needs the person_id it returns in the 'sub' field."
    mutating: false
    params:
      type: object
      properties: {}
    request:
      method: GET
      url: "https://api.linkedin.com/v2/userinfo"
    response_extract: "$"
  - name: linkedin_create_post
    description: "Publish a text post to your own LinkedIn feed. This is a REAL, PUBLIC, irreversible post visible to your network — write the final wording, not a draft."
    mutating: true
    public_write: true
    params:
      type: object
      properties:
        person_id: {type: string, description: "the 'sub' value from linkedin_me"}
        text:      {type: string, description: "the post body, as it will appear"}
      required: [person_id, text]
    request:
      method: POST
      url: "https://api.linkedin.com/rest/posts"
      body:
        author: "urn:li:person:{{person_id}}"
        commentary: "{{text}}"
        visibility: "PUBLIC"
        distribution:
          feedDistribution: "MAIN_FEED"
          targetEntities: []
          thirdPartyDistributionChannels: []
        lifecycleState: "PUBLISHED"
        isReshareDisabledByAuthor: false
    response_extract: "$"
  - name: linkedin_delete_post
    description: "Delete a LinkedIn post the connected member published. post_urn is the full URN returned by linkedin_create_post, e.g. urn:li:share:12345. Irreversible."
    mutating: true
    public_write: true
    params:
      type: object
      properties:
        post_urn: {type: string, description: "full URN, e.g. urn:li:share:12345"}
      required: [post_urn]
    request:
      method: DELETE
      url: "https://api.linkedin.com/rest/posts/{{post_urn|escape}}"
    response_extract: "$"
  - name: linkedin_create_article_post
    description: "Share a LINK on LinkedIn with a comment, rendering as an article card rather than plain text. Real and public, posted as the member. Company-page posting needs the Marketing Developer Platform, which this connector does not have."
    mutating: true
    public_write: true
    params:
      type: object
      properties:
        author_urn: {type: string, description: "urn:li:person:xxx, from linkedin_me's sub field"}
        text:       {type: string, description: "the commentary shown above the link"}
        url:        {type: string, description: "the link to share"}
        title:      {type: string, description: "headline shown on the card"}
        visibility: {type: string, description: "PUBLIC or CONNECTIONS"}
      required: [author_urn, text, url]
    request:
      method: POST
      url: "https://api.linkedin.com/rest/posts"
      body:
        author: "{{author_urn}}"
        commentary: "{{text}}"
        visibility: "{{visibility}}"
        distribution:
          feedDistribution: "MAIN_FEED"
        content:
          article:
            source: "{{url}}"
            title: "{{title}}"
        lifecycleState: "PUBLISHED"
    response_extract: "$"
