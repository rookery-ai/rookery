provider: fitbit
actions:
  - name: fitbit_profile
    description: "The authenticated user's profile: display name, timezone, height and stride. Read-only."
    mutating: false
    params: {type: object, properties: {}}
    request:
      method: GET
      url: "https://api.fitbit.com/1/user/-/profile.json"
    response_extract: "$.user"

  - name: fitbit_daily_activity
    description: "One day's activity summary: steps, distance, floors, calories and active minutes. date is YYYY-MM-DD or 'today'. Read-only."
    mutating: false
    params:
      type: object
      properties:
        date: {type: string, description: "YYYY-MM-DD, or today"}
      required: [date]
    request:
      method: GET
      url: "https://api.fitbit.com/1/user/-/activities/date/{{date}}.json"
    response_extract: "$.summary"

  - name: fitbit_sleep_log
    description: "Sleep for one night: duration, efficiency and the stage breakdown. date is the WAKE-UP date, YYYY-MM-DD. Read-only."
    mutating: false
    params:
      type: object
      properties:
        date: {type: string, description: "YYYY-MM-DD of the morning you woke"}
      required: [date]
    request:
      method: GET
      url: "https://api.fitbit.com/1.2/user/-/sleep/date/{{date}}.json"
    response_extract: "$.summary"

  - name: fitbit_heart_rate
    description: "Resting heart rate and time-in-zone for one day. date is YYYY-MM-DD or 'today'. Read-only."
    mutating: false
    params:
      type: object
      properties:
        date: {type: string, description: "YYYY-MM-DD, or today"}
      required: [date]
    request:
      method: GET
      url: "https://api.fitbit.com/1/user/-/activities/heart/date/{{date}}/1d.json"
    response_extract: "$.activities-heart"
