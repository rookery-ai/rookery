provider: radarr
actions:
  - name: radarr_calendar
    description: "Movies releasing between two dates (RFC3339 or YYYY-MM-DD) — the 'what lands this week' answer. Both bounds are required. Read-only."
    mutating: false
    params:
      type: object
      properties:
        start: {type: string, description: "YYYY-MM-DD, inclusive"}
        end:   {type: string, description: "YYYY-MM-DD, exclusive"}
      required: [start, end]
    request:
      method: GET
      url: "{{conn.base_url}}/api/v3/calendar"
      query:
        start: "{{start}}"
        end: "{{end}}"
    response_extract: "$"

  - name: radarr_queue
    description: "What is downloading right now, with progress and estimated completion. Read-only."
    mutating: false
    params:
      type: object
      properties:
        page_size: {type: integer, description: "max records, default 20"}
      required: []
    request:
      method: GET
      url: "{{conn.base_url}}/api/v3/queue"
      query:
        pageSize: "{{page_size}}"
    response_extract: "$.records"

  - name: radarr_search_movie
    description: "Look up a movie by name against Radarr's metadata provider. Returns tmdbId and title — use before adding. Read-only."
    mutating: false
    params:
      type: object
      properties:
        term: {type: string, description: "movie name"}
      required: [term]
    request:
      method: GET
      url: "{{conn.base_url}}/api/v3/movie/lookup"
      query:
        term: "{{term}}"
    response_extract: "$"

  - name: radarr_list_movie
    description: "Movie already in the library, with monitoring state and movie counts. This can be large on a big library. Read-only."
    mutating: false
    params: {type: object, properties: {}}
    request:
      method: GET
      url: "{{conn.base_url}}/api/v3/movie"
    response_extract: "$"

  - name: radarr_wanted_missing
    description: "Monitored movies that have been released but are missing from disk — the gap list. page_size caps it. Read-only."
    mutating: false
    params:
      type: object
      properties:
        page_size: {type: integer, description: "max records, default 20"}
      required: []
    request:
      method: GET
      url: "{{conn.base_url}}/api/v3/wanted/missing"
      query:
        pageSize: "{{page_size}}"
    response_extract: "$.records"

  - name: radarr_system_status
    description: "Radarr version, start time and health — use to confirm the instance is reachable. Read-only."
    mutating: false
    params: {type: object, properties: {}}
    request:
      method: GET
      url: "{{conn.base_url}}/api/v3/system/status"
    response_extract: "$"
