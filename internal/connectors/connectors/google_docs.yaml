provider: google_docs
# HOW A MODEL EDITS A DOC. Docs addresses everything by UTF-16 character index, and a
# raw documents.get is far larger than the 8 KiB tool-result cap — so a small model
# never saw most of the document and guessed indexes, and then read a bare `[{}]`
# reply as success. The actions below are Go handlers (handler: — see
# gdocs_handlers.go): the model names TEXT it can see, the handler computes the index,
# writes with requiredRevisionId, and re-reads the document to prove the edit landed.
# The index-based actions further down remain for agents already built against them.
actions:
  - name: docs_create_document
    description: "Create a new Google Doc with a title. Returns its documentId — then add text with docs_append_text. Safe write."
    mutating: false
    params:
      type: object
      properties:
        title: {type: string}
      required: [title]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents"
      body:
        title: "{{title}}"
    response_extract: "$"
  - name: docs_get_document
    description: "Read a Google Doc as numbered paragraphs (with heading styles). ALWAYS call this before editing, then quote text you see here in the edit tools — no index arithmetic. Long documents are paged: pass from_paragraph to continue, find='words' to jump to a passage, or headings_only=true for an outline. Read-only."
    mutating: false
    handler: docs_get_document
    params:
      type: object
      properties:
        document_id:    {type: string, description: "the id in the document URL, between /d/ and /edit"}
        find:           {type: string, description: "only list paragraphs containing this text"}
        from_paragraph: {type: integer, description: "start listing at this paragraph number (for long documents)"}
        headings_only:  {type: boolean, description: "list only headings — a quick outline"}
      required: [document_id]
    request:
      method: GET
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}"
    response_extract: "$"
  - name: docs_insert_text
    description: "Insert text NEXT TO text that already exists in the doc. anchor_text is a short exact quote from docs_get_document (a sentence or heading); position is after_paragraph (default — new paragraph below the anchor's paragraph), before_paragraph, after_text or before_text (inline, inside the sentence). Markdown in text becomes real headings, bullets and bold. If the anchor appears more than once, pass occurrence=N. Returns status=applied with the surrounding paragraphs — if it returns an error, NOTHING was changed. Mutating."
    mutating: true
    handler: docs_insert_text
    params:
      type: object
      properties:
        document_id: {type: string}
        anchor_text: {type: string, description: "exact text from the document to insert next to"}
        text:        {type: string, description: "the text to insert; markdown (# heading, - bullet, **bold**) is applied unless format=plain"}
        position:    {type: string, description: "after_paragraph (default) | before_paragraph | after_text | before_text"}
        occurrence:  {type: integer, description: "which match of anchor_text to use when it appears several times (1 = first)"}
        format:      {type: string, description: "markdown (default) or plain"}
        style:       {type: string, description: "force a paragraph style for the inserted text: NORMAL_TEXT, HEADING_1 … HEADING_6, TITLE"}
        index:       {type: integer, description: "LEGACY — a raw character index, used only when anchor_text is absent. Prefer anchor_text."}
      required: [document_id, text]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
    response_extract: "$"
  - name: docs_append_text
    description: "Add text at the END of a doc. No index needed. Markdown in text becomes real headings, bullets and bold (format=plain to insert it literally). Mutating."
    mutating: true
    handler: docs_append_text
    params:
      type: object
      properties:
        document_id: {type: string}
        text:        {type: string}
        format:      {type: string, description: "markdown (default) or plain"}
        style:       {type: string, description: "force a paragraph style, e.g. HEADING_2"}
        end_index:   {type: integer, description: "IGNORED — kept for older agents; the end is found automatically"}
      required: [document_id, text]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
    response_extract: "$"
  - name: docs_add_to_section
    description: "Add text under a HEADING: at the end of that section (default) or at its start (position=start). heading is the heading's text as shown by docs_get_document (headings_only=true lists them). Mutating."
    mutating: true
    handler: docs_add_to_section
    params:
      type: object
      properties:
        document_id: {type: string}
        heading:     {type: string, description: "the section heading's text"}
        text:        {type: string}
        position:    {type: string, description: "end (default) or start"}
        occurrence:  {type: integer, description: "which heading, if several share the text"}
        format:      {type: string, description: "markdown (default) or plain"}
        style:       {type: string}
      required: [document_id, heading, text]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
    response_extract: "$"
  - name: docs_replace_section
    description: "Replace EVERYTHING under a heading (up to the next heading of the same or higher level) with new text. The heading itself stays. Use to rewrite a section. Mutating — the old section text is removed."
    mutating: true
    handler: docs_replace_section
    params:
      type: object
      properties:
        document_id: {type: string}
        heading:     {type: string, description: "the section heading's text"}
        text:        {type: string, description: "the new section content (markdown applied unless format=plain)"}
        occurrence:  {type: integer}
        format:      {type: string, description: "markdown (default) or plain"}
      required: [document_id, heading, text]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
    response_extract: "$"
  - name: docs_replace_text
    description: "Replace one piece of text with another. find must be copied from the document (case, spacing and quote style are forgiven). If find appears several times, pass occurrence=N for one of them or replace_all=true for all. An empty replace deletes it. Fails — and changes nothing — when find is not in the document. Mutating."
    mutating: true
    handler: docs_replace_text
    params:
      type: object
      properties:
        document_id: {type: string}
        find:        {type: string}
        replace:     {type: string}
        occurrence:  {type: integer, description: "which occurrence to replace (1 = first)"}
        replace_all: {type: boolean, description: "replace every occurrence"}
      required: [document_id, find, replace]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
    response_extract: "$"
  - name: docs_delete_text
    description: "Delete a piece of text quoted from the document, or its whole paragraph with whole_paragraph=true. Pass occurrence=N if the text appears more than once. Mutating."
    mutating: true
    handler: docs_delete_text
    params:
      type: object
      properties:
        document_id:     {type: string}
        text:            {type: string}
        occurrence:      {type: integer}
        whole_paragraph: {type: boolean, description: "delete the entire paragraph containing text"}
      required: [document_id, text]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
    response_extract: "$"
  - name: docs_format_text
    description: "Format text quoted from the document: bold/italic/underline (true or false), link_url, and/or style to turn its paragraph into a heading (HEADING_1 … HEADING_6, TITLE) or back to NORMAL_TEXT. No indexes needed. Mutating."
    mutating: true
    handler: docs_format_text
    params:
      type: object
      properties:
        document_id: {type: string}
        text:        {type: string}
        occurrence:  {type: integer}
        bold:        {type: boolean}
        italic:      {type: boolean}
        underline:   {type: boolean}
        link_url:    {type: string}
        style:       {type: string, description: "paragraph style for the paragraph containing text"}
      required: [document_id, text]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
    response_extract: "$"
  - name: docs_batch_update
    description: "ADVANCED: apply a raw batchUpdate requests array with explicit indexes. Prefer the anchor-based tools (docs_insert_text, docs_replace_text, docs_add_to_section, docs_format_text) — they find the position for you and verify the edit. Mutating."
    mutating: true
    params:
      type: object
      properties:
        document_id: {type: string}
        requests:    {type: array}
      required: [document_id, requests]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
      body:
        requests: "{{requests}}"
    response_extract: "$"
  # ---- structure and formatting -------------------------------------------
  # ADVANCED, index-based. Kept for agents built against them; the anchor tools above
  # are what a model should reach for. Docs has one write endpoint,
  # documents:batchUpdate, and everything below is one curated request against it. Indexes are character offsets in the document body,
  # which docs_get_document reports — inserting shifts every later index, so read
  # the document again between two positional edits rather than guessing.
  - name: docs_delete_range
    description: "ADVANCED (needs start/end indexes from docs_get_document; prefer the text-anchored tools where one fits). Delete a range of content from a document by character index. start_index is inclusive, end_index EXCLUSIVE. Read docs_get_document first — indexes shift after every edit."
    mutating: true
    scopes: [https://www.googleapis.com/auth/documents]
    params:
      type: object
      properties:
        document_id: {type: string}
        start_index: {type: integer, description: "inclusive start offset"}
        end_index:   {type: integer, description: "exclusive end offset"}
      required: [document_id, start_index, end_index]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
      body:
        requests:
          - deleteContentRange:
              range: {startIndex: "{{start_index}}", endIndex: "{{end_index}}"}
    response_extract: "$.replies"
  - name: docs_insert_table
    description: "ADVANCED (needs start/end indexes from docs_get_document; prefer the text-anchored tools where one fits). Insert an empty table with the given number of rows and columns at a character index. Fill the cells afterwards with docs_insert_text at the new indexes from docs_get_document."
    mutating: true
    scopes: [https://www.googleapis.com/auth/documents]
    params:
      type: object
      properties:
        document_id: {type: string}
        index:       {type: integer, description: "character offset to insert at"}
        rows:        {type: integer}
        columns:     {type: integer}
      required: [document_id, index, rows, columns]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
      body:
        requests:
          - insertTable:
              location: {index: "{{index}}"}
              rows: "{{rows}}"
              columns: "{{columns}}"
    response_extract: "$.replies"
  - name: docs_insert_page_break
    description: "ADVANCED (needs start/end indexes from docs_get_document; prefer the text-anchored tools where one fits). Insert a page break at a character index, to start the next section on a fresh page. Mutating."
    mutating: true
    scopes: [https://www.googleapis.com/auth/documents]
    params:
      type: object
      properties:
        document_id: {type: string}
        index:       {type: integer, description: "character offset to break at"}
      required: [document_id, index]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
      body:
        requests:
          - insertPageBreak:
              location: {index: "{{index}}"}
    response_extract: "$.replies"
  - name: docs_insert_image
    description: "ADVANCED (needs start/end indexes from docs_get_document; prefer the text-anchored tools where one fits). Insert an image at a character index. The image must already be at a PUBLICLY reachable https URL — Google fetches it itself, so a local file or a private link will fail."
    mutating: true
    scopes: [https://www.googleapis.com/auth/documents]
    params:
      type: object
      properties:
        document_id: {type: string}
        index:       {type: integer, description: "character offset to insert at"}
        image_url:   {type: string, description: "publicly reachable https URL of the image"}
      required: [document_id, index, image_url]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
      body:
        requests:
          - insertInlineImage:
              location: {index: "{{index}}"}
              uri: "{{image_url}}"
    response_extract: "$.replies"
  - name: docs_set_heading_style
    description: "ADVANCED (needs start/end indexes from docs_get_document; prefer the text-anchored tools where one fits). Turn a range of text into a heading (or back to body text). style is a named style: TITLE, SUBTITLE, HEADING_1 … HEADING_6, or NORMAL_TEXT. Use after inserting text to structure a document."
    mutating: true
    scopes: [https://www.googleapis.com/auth/documents]
    params:
      type: object
      properties:
        document_id: {type: string}
        start_index: {type: integer, description: "inclusive start offset"}
        end_index:   {type: integer, description: "exclusive end offset"}
        style:       {type: string, description: "TITLE | SUBTITLE | HEADING_1..HEADING_6 | NORMAL_TEXT"}
      required: [document_id, start_index, end_index, style]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
      body:
        requests:
          - updateParagraphStyle:
              range: {startIndex: "{{start_index}}", endIndex: "{{end_index}}"}
              paragraphStyle: {namedStyleType: "{{style}}"}
              fields: "namedStyleType"
    response_extract: "$.replies"
  - name: docs_create_bullets
    description: "ADVANCED (needs start/end indexes from docs_get_document; prefer the text-anchored tools where one fits). Turn the paragraphs in a range into a bulleted or numbered list. preset is e.g. BULLET_DISC_CIRCLE_SQUARE or NUMBERED_DECIMAL_ALPHA_ROMAN."
    mutating: true
    scopes: [https://www.googleapis.com/auth/documents]
    params:
      type: object
      properties:
        document_id: {type: string}
        start_index: {type: integer, description: "inclusive start offset"}
        end_index:   {type: integer, description: "exclusive end offset"}
        preset:      {type: string, description: "BULLET_DISC_CIRCLE_SQUARE | NUMBERED_DECIMAL_ALPHA_ROMAN"}
      required: [document_id, start_index, end_index, preset]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
      body:
        requests:
          - createParagraphBullets:
              range: {startIndex: "{{start_index}}", endIndex: "{{end_index}}"}
              bulletPreset: "{{preset}}"
    response_extract: "$.replies"
  - name: docs_set_text_style
    description: "ADVANCED (needs start/end indexes from docs_get_document; prefer the text-anchored tools where one fits). Apply bold, italic, underline or a link to a range of text. Omitted flags are left alone. Use link_url to turn the range into a hyperlink."
    mutating: true
    scopes: [https://www.googleapis.com/auth/documents]
    params:
      type: object
      properties:
        document_id: {type: string}
        start_index: {type: integer, description: "inclusive start offset"}
        end_index:   {type: integer, description: "exclusive end offset"}
        bold:        {type: boolean}
        italic:      {type: boolean}
        underline:   {type: boolean}
        link_url:    {type: string, description: "make the range link to this URL"}
        fields:      {type: string, description: "comma-separated fields to apply, e.g. 'bold,italic' or 'link'. Required by the API so it knows which styles you meant to set."}
      required: [document_id, start_index, end_index, fields]
    request:
      method: POST
      url: "https://docs.googleapis.com/v1/documents/{{document_id}}:batchUpdate"
      body:
        requests:
          - updateTextStyle:
              range: {startIndex: "{{start_index}}", endIndex: "{{end_index}}"}
              textStyle:
                bold: "{{bold}}"
                italic: "{{italic}}"
                underline: "{{underline}}"
                link: {url: "{{link_url}}"}
              fields: "{{fields}}"
    response_extract: "$.replies"
