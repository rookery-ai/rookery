provider: notion
actions:
  - name: notion_search
    description: "Search the connected Notion workspace for pages and databases matching a query. Read-only. Use for 'find my Notion page about X'."
    mutating: false
    params:
      type: object
      properties:
        query: {type: string, description: "text to search page/database titles for"}
      required: [query]
    request:
      method: POST
      url: "https://api.notion.com/v1/search"
      body_json:
        query: "{{query}}"
    response_extract: "$.results"
  - name: notion_get_page
    description: "Fetch a Notion page's properties by id (from notion_search). Read-only."
    mutating: false
    params:
      type: object
      properties:
        page_id: {type: string}
      required: [page_id]
    request:
      method: GET
      url: "https://api.notion.com/v1/pages/{{page_id}}"
    response_extract: "$"
  - name: notion_get_block_children
    description: "List the content blocks of a Notion page or block by id. Read-only. Use to read a page's body after notion_get_page."
    mutating: false
    params:
      type: object
      properties:
        block_id: {type: string}
      required: [block_id]
    request:
      method: GET
      url: "https://api.notion.com/v1/blocks/{{block_id}}/children"
    response_extract: "$.results"
  - name: notion_create_page
    description: "Create a new Notion page under a parent PAGE (parent_id = an existing page id). A real write — creates a visible page. title required; content is optional body text."
    mutating: true
    params:
      type: object
      properties:
        parent_id: {type: string, description: "id of the parent page this new page is created under"}
        title:     {type: string}
        content:   {type: string}
      required: [parent_id, title]
    request:
      method: POST
      url: "https://api.notion.com/v1/pages"
      body_builder: notion_page
    response_extract: "$.id"
  - name: notion_query_database
    description: "Query a Notion database, optionally filtered and sorted, returning its pages. filter and sorts take Notion's own JSON shapes — see the Notion API reference. Read-only. Pass page_token from a previous next_cursor to page."
    mutating: false
    params:
      type: object
      properties:
        database_id: {type: string}
        filter:      {type: object, description: "Notion filter object, e.g. {\"property\":\"Status\",\"status\":{\"equals\":\"Done\"}}"}
        sorts:       {type: array, items: {type: object}, description: "e.g. [{\"property\":\"Name\",\"direction\":\"ascending\"}]"}
        page_size:   {type: integer, description: "max pages (default 25, cap 100)"}
        page_token:  {type: string, description: "next_cursor from a previous call"}
      required: [database_id]
    request:
      method: POST
      url: "https://api.notion.com/v1/databases/{{database_id}}/query"
      body:
        filter: "{{filter}}"
        sorts: "{{sorts}}"
        page_size: "{{page_size}}"
        start_cursor: "{{page_token}}"
    response_extract: "$.results"
    response_cursor: "$.next_cursor"
  - name: notion_get_database
    description: "Get a Notion database's schema — every property, its type, and for select properties its options. Read this BEFORE creating or updating rows, or the property names will be wrong. Read-only."
    mutating: false
    params:
      type: object
      properties:
        database_id: {type: string}
      required: [database_id]
    request:
      method: GET
      url: "https://api.notion.com/v1/databases/{{database_id}}"
    response_extract: "$"
  - name: notion_create_database_row
    description: "Create a page (row) in a Notion database. properties must match the database's schema EXACTLY — read notion_get_database first. A title property is required by Notion."
    mutating: false
    params:
      type: object
      properties:
        database_id: {type: string}
        properties:  {type: object, description: "Notion properties object matching the database schema"}
      required: [database_id, properties]
    request:
      method: POST
      url: "https://api.notion.com/v1/pages"
      body:
        parent: {database_id: "{{database_id}}"}
        properties: "{{properties}}"
    response_extract: "$"
  - name: notion_update_page
    description: "Update a Notion page's properties, or archive it. properties must match the parent database's schema — read notion_get_database first. Set archived=true to move the page to the trash."
    mutating: false
    params:
      type: object
      properties:
        page_id:    {type: string}
        properties: {type: object, description: "Notion properties object; only the keys given are changed"}
        archived:   {type: boolean, description: "true to archive (trash) the page"}
      required: [page_id]
    request:
      method: PATCH
      url: "https://api.notion.com/v1/pages/{{page_id}}"
      body:
        properties: "{{properties}}"
        archived: "{{archived}}"
    response_extract: "$"
  - name: notion_append_blocks
    description: "Append content blocks to the end of a Notion page or block. children takes Notion's block objects — see the API reference for paragraph, heading and to-do shapes."
    mutating: false
    params:
      type: object
      properties:
        block_id: {type: string, description: "page id or parent block id"}
        children: {type: array, items: {type: object}, description: "Notion block objects"}
      required: [block_id, children]
    request:
      method: PATCH
      url: "https://api.notion.com/v1/blocks/{{block_id}}/children"
      body:
        children: "{{children}}"
    response_extract: "$.results"
  - name: notion_delete_block
    description: "Move a Notion block or page to the trash. Recoverable from Notion's trash, unlike a permanent delete."
    mutating: true
    params:
      type: object
      properties:
        block_id: {type: string}
      required: [block_id]
    request:
      method: DELETE
      url: "https://api.notion.com/v1/blocks/{{block_id}}"
    response_extract: "$"
  - name: notion_list_users
    description: "List the users in the connected Notion workspace, with their ids — needed to set a person property. Read-only."
    mutating: false
    params:
      type: object
      properties:
        page_size: {type: integer, description: "max users (default 50)"}
    request:
      method: GET
      url: "https://api.notion.com/v1/users"
      query:
        page_size: "{{page_size}}"
    response_extract: "$.results"
