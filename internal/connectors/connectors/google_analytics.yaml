provider: google_analytics
actions:
  - name: ga4_list_properties
    description: "List the GA4 properties you can access, with their display names. Read-only. Call this FIRST — reporting actions need the property resource name it returns, e.g. properties/123456789."
    mutating: false
    params:
      type: object
      properties: {}
    request:
      method: GET
      url: "https://analyticsadmin.googleapis.com/v1beta/accountSummaries"
    response_extract: "$.accountSummaries"
  - name: ga4_run_report
    description: "Run a GA4 report over a date range. Read-only. Use for 'how many users last week', 'top pages this month', 'traffic by country'."
    mutating: false
    params:
      type: object
      properties:
        property:   {type: string, description: "property resource name from ga4_list_properties, e.g. properties/123456789"}
        start_date: {type: string, description: "YYYY-MM-DD, or a relative form like 28daysAgo / yesterday"}
        end_date:   {type: string, description: "YYYY-MM-DD, or today / yesterday"}
        metrics:    {type: string, description: "comma-separated GA4 metric names, e.g. activeUsers,screenPageViews"}
        dimensions: {type: string, description: "comma-separated GA4 dimension names, e.g. date or pagePath. Optional."}
        limit:      {type: integer, description: "max rows — REQUIRED. Use 50 unless you truly need more; GA4 returns up to 10000 rows when unset."}
      required: [property, start_date, end_date, metrics, limit]
    request:
      method: POST
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}:runReport"
      body_builder: ga4_report
    response_extract: "$.rows"
  - name: ga4_run_realtime_report
    description: "Active users and events in the last 30 minutes. Read-only. Use for 'who is on the site right now'."
    mutating: false
    params:
      type: object
      properties:
        property:   {type: string, description: "property resource name, e.g. properties/123456789"}
        metrics:    {type: string, description: "comma-separated, e.g. activeUsers"}
        dimensions: {type: string, description: "comma-separated, e.g. country. Optional."}
      required: [property, metrics]
    request:
      method: POST
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}:runRealtimeReport"
      body_builder: ga4_realtime
    response_extract: "$.rows"
  - name: ga4_metadata
    description: "List the metric and dimension names available for a property. Read-only. Call this when a report fails with an unknown metric or dimension."
    mutating: false
    params:
      type: object
      properties:
        property: {type: string, description: "property resource name, e.g. properties/123456789"}
      required: [property]
    request:
      method: GET
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}/metadata"
    response_extract: "$"
  - name: ga4_top_pages
    description: "The most-viewed pages on a GA4 property between two dates, with views, users and average engagement time. Dates are YYYY-MM-DD or relative like '28daysAgo'. Read-only."
    mutating: false
    params:
      type: object
      properties:
        property:   {type: string, description: "properties/123456 from ga4_list_properties"}
        start_date: {type: string, description: "YYYY-MM-DD or e.g. 28daysAgo"}
        end_date:   {type: string, description: "YYYY-MM-DD or 'today'"}
        limit:      {type: integer, description: "max rows (default 20)"}
      required: [property, start_date, end_date]
    request:
      method: POST
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}:runReport"
      body:
        dateRanges: [{startDate: "{{start_date}}", endDate: "{{end_date}}"}]
        dimensions: [{name: "pagePath"}, {name: "pageTitle"}]
        metrics: [{name: "screenPageViews"}, {name: "activeUsers"}, {name: "userEngagementDuration"}]
        orderBys: [{metric: {metricName: "screenPageViews"}, desc: true}]
        limit: "{{limit}}"
    response_extract: "$.rows"
  - name: ga4_traffic_sources
    description: "Where a GA4 property's traffic came from between two dates — session source, medium and campaign, with sessions and conversions. Read-only."
    mutating: false
    params:
      type: object
      properties:
        property:   {type: string, description: "properties/123456"}
        start_date: {type: string, description: "YYYY-MM-DD or e.g. 28daysAgo"}
        end_date:   {type: string, description: "YYYY-MM-DD or 'today'"}
        limit:      {type: integer, description: "max rows (default 20)"}
      required: [property, start_date, end_date]
    request:
      method: POST
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}:runReport"
      body:
        dateRanges: [{startDate: "{{start_date}}", endDate: "{{end_date}}"}]
        dimensions: [{name: "sessionSource"}, {name: "sessionMedium"}, {name: "sessionCampaignName"}]
        metrics: [{name: "sessions"}, {name: "activeUsers"}, {name: "conversions"}]
        orderBys: [{metric: {metricName: "sessions"}, desc: true}]
        limit: "{{limit}}"
    response_extract: "$.rows"
  - name: ga4_daily_users
    description: "Active users, sessions and conversions per DAY between two dates — the trend line for a GA4 property. Read-only."
    mutating: false
    params:
      type: object
      properties:
        property:   {type: string, description: "properties/123456"}
        start_date: {type: string, description: "YYYY-MM-DD or e.g. 28daysAgo"}
        end_date:   {type: string, description: "YYYY-MM-DD or 'today'"}
      required: [property, start_date, end_date]
    request:
      method: POST
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}:runReport"
      body:
        dateRanges: [{startDate: "{{start_date}}", endDate: "{{end_date}}"}]
        dimensions: [{name: "date"}]
        metrics: [{name: "activeUsers"}, {name: "sessions"}, {name: "conversions"}]
        orderBys: [{dimension: {dimensionName: "date"}}]
        limit: 400
    response_extract: "$.rows"
  - name: ga4_country_breakdown
    description: "A GA4 property's users and sessions by country between two dates. Read-only."
    mutating: false
    params:
      type: object
      properties:
        property:   {type: string, description: "properties/123456"}
        start_date: {type: string, description: "YYYY-MM-DD or e.g. 28daysAgo"}
        end_date:   {type: string, description: "YYYY-MM-DD or 'today'"}
        limit:      {type: integer, description: "max rows (default 20)"}
      required: [property, start_date, end_date]
    request:
      method: POST
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}:runReport"
      body:
        dateRanges: [{startDate: "{{start_date}}", endDate: "{{end_date}}"}]
        dimensions: [{name: "country"}]
        metrics: [{name: "activeUsers"}, {name: "sessions"}]
        orderBys: [{metric: {metricName: "activeUsers"}, desc: true}]
        limit: "{{limit}}"
    response_extract: "$.rows"
  - name: ga4_device_breakdown
    description: "A GA4 property's users and sessions by device category (desktop, mobile, tablet). Read-only."
    mutating: false
    params:
      type: object
      properties:
        property:   {type: string, description: "properties/123456"}
        start_date: {type: string, description: "YYYY-MM-DD or e.g. 28daysAgo"}
        end_date:   {type: string, description: "YYYY-MM-DD or 'today'"}
      required: [property, start_date, end_date]
    request:
      method: POST
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}:runReport"
      body:
        dateRanges: [{startDate: "{{start_date}}", endDate: "{{end_date}}"}]
        dimensions: [{name: "deviceCategory"}]
        metrics: [{name: "activeUsers"}, {name: "sessions"}, {name: "bounceRate"}]
        limit: 20
    response_extract: "$.rows"
  - name: ga4_events_summary
    description: "The most frequent events on a GA4 property between two dates, with their counts and how many users triggered them. Read-only."
    mutating: false
    params:
      type: object
      properties:
        property:   {type: string, description: "properties/123456"}
        start_date: {type: string, description: "YYYY-MM-DD or e.g. 28daysAgo"}
        end_date:   {type: string, description: "YYYY-MM-DD or 'today'"}
        limit:      {type: integer, description: "max rows (default 25)"}
      required: [property, start_date, end_date]
    request:
      method: POST
      url: "https://analyticsdata.googleapis.com/v1beta/{{property}}:runReport"
      body:
        dateRanges: [{startDate: "{{start_date}}", endDate: "{{end_date}}"}]
        dimensions: [{name: "eventName"}]
        metrics: [{name: "eventCount"}, {name: "totalUsers"}]
        orderBys: [{metric: {metricName: "eventCount"}, desc: true}]
        limit: "{{limit}}"
    response_extract: "$.rows"
