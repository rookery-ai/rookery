provider: openfoodfacts
actions:
  - name: off_get_product
    description: "Look up a food product by its barcode (EAN/UPC) for ingredients, allergens, nutrition and Nutri-Score. Data is volunteer-contributed, so completeness varies by product and country. Read-only."
    mutating: false
    params:
      type: object
      properties:
        barcode: {type: string, description: "EAN-13 or UPC, digits only"}
      required: [barcode]
    request:
      method: GET
      url: "https://world.openfoodfacts.org/api/v2/product/{{barcode}}"
      query:
        fields: "product_name,brands,quantity,ingredients_text,allergens_tags,nutriscore_grade,nova_group,nutriments,categories,countries"
    response_extract: "$.product"

  - name: off_search_products
    description: "Search food products by name or brand. page_size caps the result — the database holds millions of products. Read-only."
    mutating: false
    params:
      type: object
      properties:
        query:     {type: string, description: "product or brand name"}
        page_size: {type: integer, description: "max results, default 10"}
      required: [query]
    request:
      method: GET
      url: "https://world.openfoodfacts.org/api/v2/search"
      query:
        categories_tags_en: "{{query}}"
        page_size: "{{page_size}}"
        fields: "code,product_name,brands,nutriscore_grade,quantity"
    response_extract: "$.products"
