provider: trello
actions:
  - name: trello_list_boards
    description: "List the authenticated member's boards. Read-only."
    mutating: false
    params: {type: object, properties: {}}
    request: {method: GET, url: "https://api.trello.com/1/members/me/boards", query: {key: "{{conn.trello_key}}"}}
    response_extract: "$"
  - name: trello_get_board
    description: "Get a board by id. Read-only."
    mutating: false
    params: {type: object, properties: {id: {type: string}}, required: [id]}
    request: {method: GET, url: "https://api.trello.com/1/boards/{{id}}", query: {key: "{{conn.trello_key}}"}}
    response_extract: "$"
  - name: trello_list_lists
    description: "List the lists on a board. Read-only."
    mutating: false
    params: {type: object, properties: {board_id: {type: string}}, required: [board_id]}
    request: {method: GET, url: "https://api.trello.com/1/boards/{{board_id}}/lists", query: {key: "{{conn.trello_key}}"}}
    response_extract: "$"
  - name: trello_list_cards
    description: "List the cards in a list. Read-only."
    mutating: false
    params: {type: object, properties: {list_id: {type: string}}, required: [list_id]}
    request: {method: GET, url: "https://api.trello.com/1/lists/{{list_id}}/cards", query: {key: "{{conn.trello_key}}"}}
    response_extract: "$"
  - name: trello_create_card
    description: "Create a card in a list. Mutating."
    mutating: true
    params: {type: object, properties: {list_id: {type: string}, name: {type: string}, desc: {type: string}}, required: [list_id, name]}
    request: {method: POST, url: "https://api.trello.com/1/cards", query: {key: "{{conn.trello_key}}", idList: "{{list_id}}", name: "{{name}}", desc: "{{desc}}"}}
    response_extract: "$"
  - name: trello_update_card
    description: "Update a card by id (name/desc/list). Mutating."
    mutating: true
    params: {type: object, properties: {id: {type: string}, name: {type: string}, desc: {type: string}, list_id: {type: string}}, required: [id]}
    request: {method: PUT, url: "https://api.trello.com/1/cards/{{id}}", query: {key: "{{conn.trello_key}}", name: "{{name}}", desc: "{{desc}}", idList: "{{list_id}}"}}
    response_extract: "$"
  - name: trello_create_list
    description: "Create a list on a board. Mutating."
    mutating: true
    params: {type: object, properties: {board_id: {type: string}, name: {type: string}}, required: [board_id, name]}
    request: {method: POST, url: "https://api.trello.com/1/lists", query: {key: "{{conn.trello_key}}", idBoard: "{{board_id}}", name: "{{name}}"}}
    response_extract: "$"
  - name: trello_add_comment
    description: "Add a comment to a card. Mutating."
    mutating: true
    params: {type: object, properties: {id: {type: string}, text: {type: string}}, required: [id, text]}
    request: {method: POST, url: "https://api.trello.com/1/cards/{{id}}/actions/comments", query: {key: "{{conn.trello_key}}", text: "{{text}}"}}
    response_extract: "$"
  - name: trello_get_member
    description: "Get a member by id or username ('me' for self). Read-only."
    mutating: false
    params: {type: object, properties: {id: {type: string}}, required: [id]}
    request: {method: GET, url: "https://api.trello.com/1/members/{{id}}", query: {key: "{{conn.trello_key}}"}}
    response_extract: "$"
  - name: trello_move_card
    description: "Move a card to a different list, and optionally to a position within it. Resolve the destination list id with trello_list_lists first."
    mutating: true
    params:
      type: object
      properties:
        card_id:  {type: string}
        list_id:  {type: string, description: "destination list id"}
        position: {type: string, description: "top, bottom, or a number"}
      required: [card_id, list_id]
    request:
      method: PUT
      url: "https://api.trello.com/1/cards/{{card_id}}"
      query:
        idList: "{{list_id}}"
        pos: "{{position}}"
    response_extract: "$"
  - name: trello_archive_card
    description: "Archive a Trello card, removing it from the board without deleting it. Pass closed=false to restore it."
    mutating: true
    params:
      type: object
      properties:
        card_id: {type: string}
        closed:  {type: boolean, description: "true to archive, false to restore"}
      required: [card_id, closed]
    request:
      method: PUT
      url: "https://api.trello.com/1/cards/{{card_id}}"
      query:
        closed: "{{closed}}"
    response_extract: "$"
  - name: trello_add_card_member
    description: "Assign a board member to a card. Resolve the member id with trello_get_member or the board's member list."
    mutating: true
    params:
      type: object
      properties:
        card_id:   {type: string}
        member_id: {type: string}
      required: [card_id, member_id]
    request:
      method: POST
      url: "https://api.trello.com/1/cards/{{card_id}}/idMembers"
      query:
        value: "{{member_id}}"
    response_extract: "$"
  - name: trello_set_card_due
    description: "Set or clear a card's due date. due is an ISO-8601 timestamp; pass due_complete=true to mark the due date done."
    mutating: true
    params:
      type: object
      properties:
        card_id:       {type: string}
        due:           {type: string, description: "ISO-8601 timestamp"}
        due_complete:  {type: boolean, description: "mark the due date as done"}
      required: [card_id]
    request:
      method: PUT
      url: "https://api.trello.com/1/cards/{{card_id}}"
      query:
        due: "{{due}}"
        dueComplete: "{{due_complete}}"
    response_extract: "$"
  - name: trello_search
    description: "Search across the connected Trello account's boards, cards and members. Read-only."
    mutating: false
    params:
      type: object
      properties:
        query:      {type: string, description: "search text"}
        model_types: {type: string, description: "comma-separated: cards,boards,members"}
      required: [query]
    request:
      method: GET
      url: "https://api.trello.com/1/search"
      query:
        query: "{{query}}"
        modelTypes: "{{model_types}}"
    response_extract: "$"
