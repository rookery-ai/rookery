provider: meta_ads
actions:
  - name: meta_ads_list_accounts
    description: "List the ad accounts you can access. Read-only. Call this FIRST — every other action needs the account id it returns, which looks like act_1234567890."
    mutating: false
    params:
      type: object
      properties: {}
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/me/adaccounts"
      query:
        fields: "id,name,account_status,currency"
    response_extract: "$.data"
  - name: meta_ads_insights
    description: "Spend, impressions, clicks, and other performance metrics for an ad account over a preset date range. Read-only. Use for 'what did I spend last week', 'how are my campaigns doing'."
    mutating: false
    params:
      type: object
      properties:
        account_id:  {type: string, description: "ad account id from meta_ads_list_accounts, e.g. act_1234567890"}
        date_preset: {type: string, description: "one of today, yesterday, this_week_mon_today, last_7d, last_14d, last_30d, this_month, last_month"}
        level:       {type: string, description: "one of account, campaign, adset, ad (default account)"}
        fields:      {type: string, description: "comma-separated, e.g. spend,impressions,clicks,ctr,cpc"}
        limit:       {type: integer, description: "max rows — REQUIRED. Use 25 unless you truly need more; insights responses are large."}
      required: [account_id, date_preset, fields, limit]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{account_id}}/insights"
      query:
        date_preset: "{{date_preset}}"
        level:       "{{level}}"
        fields:      "{{fields}}"
        limit:       "{{limit}}"
    response_extract: "$.data"
  - name: meta_ads_list_campaigns
    description: "List campaigns in an ad account with their status and budgets. Read-only."
    mutating: false
    params:
      type: object
      properties:
        account_id: {type: string, description: "ad account id, e.g. act_1234567890"}
        limit:      {type: integer, description: "max rows — REQUIRED. Use 25."}
      required: [account_id, limit]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{account_id}}/campaigns"
      query:
        fields: "id,name,status,objective,daily_budget,lifetime_budget"
        limit:  "{{limit}}"
    response_extract: "$.data"
  - name: meta_ads_set_campaign_status
    description: "Pause or resume a campaign. Mutating but PRIVATE and reversible — it changes delivery, it does not publish anything."
    mutating: true
    params:
      type: object
      properties:
        campaign_id: {type: string, description: "campaign id from meta_ads_list_campaigns"}
        status:      {type: string, description: "ACTIVE or PAUSED"}
      required: [campaign_id, status]
    request:
      method: POST
      url: "https://graph.facebook.com/v21.0/{{campaign_id}}"
      form:
        status: "{{status}}"
    response_extract: "$"
  - name: meta_ads_list_adsets
    description: "List the ad sets in an ad account or one campaign, with their status, budget and targeting summary. Read-only."
    mutating: false
    params:
      type: object
      properties:
        account_id:  {type: string, description: "act_XXXX from meta_ads_list_accounts"}
        campaign_id: {type: string, description: "optional: only ad sets in this campaign"}
        limit:       {type: integer, description: "max ad sets (default 25)"}
      required: [account_id]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{account_id}}/adsets"
      query:
        fields: "id,name,status,daily_budget,lifetime_budget,optimization_goal,campaign_id"
        filtering: "{{campaign_id}}"
        limit: "{{limit}}"
    response_extract: "$.data"
  - name: meta_ads_list_ads
    description: "List the individual ads in an ad account with their status and the ad set they belong to. Read-only."
    mutating: false
    params:
      type: object
      properties:
        account_id: {type: string, description: "act_XXXX"}
        limit:      {type: integer, description: "max ads (default 25)"}
      required: [account_id]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{account_id}}/ads"
      query:
        fields: "id,name,status,adset_id,campaign_id,creative{id,title,body}"
        limit: "{{limit}}"
    response_extract: "$.data"
  - name: meta_ads_campaign_insights
    description: "Performance for ONE campaign over a date preset or explicit range — spend, impressions, clicks, CPC, CTR and actions. Read-only."
    mutating: false
    params:
      type: object
      properties:
        campaign_id:  {type: string}
        date_preset:  {type: string, description: "today | yesterday | last_7d | last_30d | this_month"}
        breakdowns:   {type: string, description: "optional, e.g. age,gender or device_platform"}
      required: [campaign_id]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{campaign_id}}/insights"
      query:
        fields: "campaign_name,spend,impressions,clicks,cpc,ctr,reach,actions"
        date_preset: "{{date_preset}}"
        breakdowns: "{{breakdowns}}"
    response_extract: "$.data"
  - name: meta_ads_adset_insights
    description: "Performance for ONE ad set — spend, impressions, clicks and actions. Use to compare targeting within a campaign. Read-only."
    mutating: false
    params:
      type: object
      properties:
        adset_id:    {type: string}
        date_preset: {type: string, description: "today | yesterday | last_7d | last_30d"}
        breakdowns:  {type: string, description: "optional, e.g. age,gender"}
      required: [adset_id]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{adset_id}}/insights"
      query:
        fields: "adset_name,spend,impressions,clicks,cpc,ctr,reach,actions"
        date_preset: "{{date_preset}}"
        breakdowns: "{{breakdowns}}"
    response_extract: "$.data"
  - name: meta_ads_ad_insights
    description: "Performance for ONE ad, so creative can be compared rather than targeting. Read-only."
    mutating: false
    params:
      type: object
      properties:
        ad_id:       {type: string}
        date_preset: {type: string, description: "today | yesterday | last_7d | last_30d"}
      required: [ad_id]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{ad_id}}/insights"
      query:
        fields: "ad_name,spend,impressions,clicks,cpc,ctr,reach,actions"
        date_preset: "{{date_preset}}"
    response_extract: "$.data"
  - name: meta_ads_daily_insights
    description: "Account performance broken down by DAY over a range, for a spend trend. time_increment=1 is what makes it per-day rather than one total. Read-only."
    mutating: false
    params:
      type: object
      properties:
        account_id: {type: string, description: "act_XXXX"}
        since:      {type: string, description: "YYYY-MM-DD"}
        until:      {type: string, description: "YYYY-MM-DD"}
      required: [account_id, since, until]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{account_id}}/insights"
      query:
        fields: "spend,impressions,clicks,cpc,ctr,reach"
        time_range: "{\"since\":\"{{since}}\",\"until\":\"{{until}}\"}"
        time_increment: "1"
    response_extract: "$.data"
  - name: meta_ads_set_adset_status
    description: "Pause or activate an ad set. This starts or stops real spending on that targeting — confirm with the user first."
    mutating: true
    params:
      type: object
      properties:
        adset_id: {type: string}
        status:   {type: string, description: "ACTIVE | PAUSED"}
      required: [adset_id, status]
    request:
      method: POST
      url: "https://graph.facebook.com/v21.0/{{adset_id}}"
      form:
        status: "{{status}}"
    response_extract: "$"
  - name: meta_ads_set_ad_status
    description: "Pause or activate a single ad, leaving the rest of its ad set running. Affects real spending."
    mutating: true
    params:
      type: object
      properties:
        ad_id:  {type: string}
        status: {type: string, description: "ACTIVE | PAUSED"}
      required: [ad_id, status]
    request:
      method: POST
      url: "https://graph.facebook.com/v21.0/{{ad_id}}"
      form:
        status: "{{status}}"
    response_extract: "$"
  - name: meta_ads_update_adset_budget
    description: "Change an ad set's DAILY budget. daily_budget is in the account's currency MINOR units — 25.00 EUR is 2500. This changes real spending; confirm the figure first."
    mutating: true
    params:
      type: object
      properties:
        adset_id:     {type: string}
        daily_budget: {type: integer, description: "minor units, e.g. 2500 for 25.00"}
      required: [adset_id, daily_budget]
    request:
      method: POST
      url: "https://graph.facebook.com/v21.0/{{adset_id}}"
      form:
        daily_budget: "{{daily_budget}}"
    response_extract: "$"
  - name: meta_ads_account_summary
    description: "Get an ad account's name, currency, timezone, spend cap and amount spent to date. Read the CURRENCY here before interpreting any budget or spend figure. Read-only."
    mutating: false
    params:
      type: object
      properties:
        account_id: {type: string, description: "act_XXXX"}
      required: [account_id]
    request:
      method: GET
      url: "https://graph.facebook.com/v21.0/{{account_id}}"
      query:
        fields: "id,name,currency,timezone_name,account_status,amount_spent,spend_cap,balance"
    response_extract: "$"
