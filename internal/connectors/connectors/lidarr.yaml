provider: lidarr
actions:
  - name: lidarr_system_status
    description: "Read Lidarr's version and health. The cheapest way to check the connection works. Read-only."
    mutating: false
    params:
      type: object
      properties: {}
    request:
      method: GET
      url: "{{conn.base_url}}/api/v1/system/status"
    response_extract: "$"

  - name: lidarr_list_queue
    description: "List what Lidarr is currently downloading, with progress and status. Read-only."
    mutating: false
    params:
      type: object
      properties:
        page_size: {type: integer, description: "How many to return."}
    request:
      method: GET
      url: "{{conn.base_url}}/api/v1/queue"
      query:
        pageSize: "{{page_size}}"
    response_extract: "$.records"

  - name: lidarr_list_health
    description: "List Lidarr's active health warnings — the things its own UI shows in red. Worth a scheduled check. Read-only."
    mutating: false
    params:
      type: object
      properties: {}
    request:
      method: GET
      url: "{{conn.base_url}}/api/v1/health"
    response_extract: "$"

  - name: lidarr_list_artists
    description: "List the artists Lidarr is monitoring. Read-only."
    mutating: false
    params:
      type: object
      properties: {}
    request:
      method: GET
      url: "{{conn.base_url}}/api/v1/artist"
    response_extract: "$"

  - name: lidarr_list_wanted_missing
    description: "List monitored albums Lidarr has not found yet. Read-only."
    mutating: false
    params:
      type: object
      properties:
        page_size: {type: integer}
    request:
      method: GET
      url: "{{conn.base_url}}/api/v1/wanted/missing"
      query:
        pageSize: "{{page_size}}"
    response_extract: "$.records"
