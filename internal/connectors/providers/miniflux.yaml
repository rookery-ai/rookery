name: miniflux
label: Miniflux
category: Self-hosted
unverified: true
auth:
  kind: api_key
  placement: header
  header_name: X-Auth-Token
  value_prefix: ""
  key_label: "Miniflux API key"
  key_hint: "from Settings → API Keys"
  setup_url: https://miniflux.app/docs/api.html
connect_inputs:
  - key: base_url
    label: "Miniflux URL"
    hint: "e.g. https://reader.example.com — a path prefix is fine"
    required: true
    normalize: base_url
setup_steps:
  - "In Miniflux open Settings → API Keys and create a new key."
  - "Copy it and enter it with your Miniflux URL below."
  - "An API key is preferable to your password: it can be revoked on its own."
