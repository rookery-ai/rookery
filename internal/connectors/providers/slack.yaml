name: slack
label: Slack
category: Communication
authorize_url: https://slack.com/oauth/v2/authorize
token_url: https://slack.com/api/oauth.v2.access
token_expiry: never
identity_path: ""
default_scopes:
  - chat:write
  - channels:read
  - channels:history
  - groups:read
  - users:read
  - users:read.email
  - reactions:write
  - channels:manage
setup_url: https://api.slack.com/apps
setup_steps:
  - "Go to api.slack.com/apps → Create New App → From scratch."
  - "OAuth & Permissions → add the Bot Token Scopes listed for this connector."
  - "Add the redirect URL shown above under Redirect URLs, then Save."
  - "Install the app to your workspace, then copy the Client ID and Client Secret from Basic Information."

# Verified 2026-07-29 against
# https://docs.slack.dev/authentication/installing-with-oauth/ — "Redirect URLs
# and URIs must use HTTPS". There is NO localhost exemption, which is why this
# provider needs a reverse proxy on a plain-http install.
redirect_policy:
  scheme: https
  allow_raw_ip: "no"
  verified: true
