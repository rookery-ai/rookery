name: notion
label: Notion
category: Productivity
setup_url: https://www.notion.so/my-integrations
setup_steps:
  - "Go to Notion → My integrations → New integration → choose \"Public\" (OAuth)."
  - "Fill in the basic info; under OAuth Domain & URIs add {{redirect_uri}} exactly."
  - "Save, then open the integration's Secrets/OAuth section."
  - "Copy the OAuth client ID and client secret and paste them below."
  - "After connecting, share the specific Notion pages/databases with the integration so it can access them."
authorize_url: https://api.notion.com/v1/oauth/authorize
token_url: https://api.notion.com/v1/oauth/token
userinfo_url: ""
identity_path: ""
token_expiry: never
token_auth: basic
token_content_type: json
authorize_extra:
  owner: user
static_headers:
  Notion-Version: "2022-06-28"

# Verified 2026-07-29 against
# https://developers.notion.com/guides/get-started/authorization — https is
# required in production; http://localhost is accepted for development.
redirect_policy:
  scheme: https_or_loopback
  verified: true
