name: radarr
label: Radarr
category: Self-hosted
unverified: true
auth:
  kind: api_key
  placement: header
  header_name: X-Api-Key
  value_prefix: ""
  key_label: "Radarr API key"
  key_hint: "from Settings → General → Security"
  setup_url: https://wiki.servarr.com/radarr/settings
connect_inputs:
  - key: base_url
    label: "Radarr URL"
    hint: "e.g. http://radarr.local:7878 — a LAN address is fine"
    required: true
    normalize: base_url
setup_steps:
  - "In Radarr open Settings → General and scroll to the Security section."
  - "Copy the API Key shown there and enter it with your Radarr URL below."
  - "The key grants full control of the instance — there is no read-only variant."
