name: github
label: GitHub
category: Developer
setup_url: https://github.com/settings/developers
setup_steps:
  - "Go to GitHub → Settings → Developer settings → OAuth Apps → New OAuth App."
  - "Application name: anything (e.g. Simple Agents)."
  - "Homepage URL: your dashboard URL (e.g. https://agents.rookie.lan)."
  - "Authorization callback URL: paste the redirect URI shown above exactly."
  - "Click Register application, then Generate a new client secret."
  - "Copy the Client ID and the generated Client secret and paste them below."
authorize_url: https://github.com/login/oauth/authorize
token_url: https://github.com/login/oauth/access_token
userinfo_url: https://api.github.com/user
identity_path: login
token_expiry: never
static_headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"
default_scopes:
  - repo
  - read:user
