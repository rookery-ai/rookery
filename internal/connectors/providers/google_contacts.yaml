name: google_contacts
label: Google Contacts
category: Google
unverified: true
auth_parent: google
default_scopes:
  - https://www.googleapis.com/auth/contacts
setup_url: https://console.cloud.google.com/apis/credentials
setup_steps:
  - "Google Contacts reuses your Google (Gmail) OAuth app. Set up Google first on its card above."
  - "In Google Cloud Console → APIs & Services → Library, also enable the People API."
  - "Then click Connect here to authorize Contacts access on the same Google account."
