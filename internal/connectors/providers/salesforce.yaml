name: salesforce
label: Salesforce
category: Commerce
authorize_url: https://login.salesforce.com/services/oauth2/authorize
token_url: https://login.salesforce.com/services/oauth2/token
token_extra: [instance_url]
default_scopes: [api, refresh_token]
setup_url: https://help.salesforce.com/s/articleView?id=sf.connected_app_create.htm
setup_steps:
  - "Salesforce Setup → App Manager → New Connected App → Enable OAuth Settings."
  - "Add {{redirect_uri}} as the Callback URL; select scopes: Manage user data via APIs (api) + refresh_token."
  - "After saving, copy the Consumer Key and Consumer Secret below."
oauth_creds:
  id_label: "Consumer Key"
  secret_label: "Consumer Secret"
