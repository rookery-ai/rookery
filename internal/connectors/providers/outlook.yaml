name: outlook
label: Outlook (Microsoft 365)
category: Productivity
setup_url: https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade
setup_steps:
  - "Go to the Microsoft Entra admin center → App registrations → New registration."
  - "Supported account types: \"Accounts in any organizational directory and personal Microsoft accounts\"."
  - "Redirect URI: platform \"Web\", value = {{redirect_uri}} exactly."
  - "After creating, copy the Application (client) ID."
  - "Certificates & secrets → New client secret → copy its Value (not the Secret ID)."
  - "Paste the Application (client) ID and the secret's Value (not the Secret ID) below."
oauth_creds:
  id_label: "Application (client) ID"
  secret_hint: "the secret's Value, not the Secret ID"
authorize_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
userinfo_url: https://graph.microsoft.com/v1.0/me
identity_path: userPrincipalName
authorize_extra:
  include_granted_scopes: "true"
  # Without this the Microsoft identity platform reuses the signed-in account, so
  # a second connect re-authorizes the first and multi-account cannot be reached.
  # Applies to the aliased child (teams) too, which consents through this app.
  prompt: select_account
default_scopes:
  - offline_access
  - https://graph.microsoft.com/Mail.Read
  - https://graph.microsoft.com/Mail.Send
  - https://graph.microsoft.com/Mail.ReadWrite
  - https://graph.microsoft.com/User.Read
