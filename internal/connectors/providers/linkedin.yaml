name: linkedin
label: LinkedIn
category: Publishing & Media
authorize_url: https://www.linkedin.com/oauth/v2/authorization
token_url: https://www.linkedin.com/oauth/v2/accessToken
userinfo_url: https://api.linkedin.com/v2/userinfo
identity_path: email
default_scopes:
  - openid
  - profile
  - email
  - w_member_social
static_headers:
  # LinkedIn versions monthly and SUNSETS each version after ~12 months; an
  # unversioned or sunset value is rejected outright, so this is not cosmetic.
  # Bump it when the release you pin drops off the supported list.
  LinkedIn-Version: "202606"
  X-Restli-Protocol-Version: "2.0.0"
setup_url: https://www.linkedin.com/developers/apps
setup_steps:
  - "Go to LinkedIn Developers → Create app, and associate it with a Company Page you control."
  - "On the Products tab, request 'Sign In with LinkedIn using OpenID Connect' AND 'Share on LinkedIn'. Both are self-serve and approve immediately."
  - "On the Auth tab, add the redirect URI shown above exactly."
  - "Copy the Client ID and Client Secret and paste them below."
  - "Note: posting to a COMPANY page (rather than your own profile) needs the Marketing Developer Platform, which is a partner application — this connector posts as you."
