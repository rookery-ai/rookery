name: jellyfin
label: Jellyfin
category: Self-hosted
unverified: true
auth:
  kind: api_key
  placement: header
  header_name: X-Emby-Token
  value_prefix: ""
  key_label: "Jellyfin API key"
  key_hint: "from Dashboard → API Keys"
  setup_url: https://jellyfin.org/docs/general/server/quick-start
connect_inputs:
  - key: base_url
    label: "Jellyfin server URL"
    hint: "e.g. http://jellyfin.local:8096 — a LAN address is fine"
    required: true
    normalize: base_url
setup_steps:
  - "In Jellyfin open Dashboard → API Keys and press the + button to create one."
  - "Copy the key and enter it with your server's URL below."
  - "An API key is server-wide: it is not scoped to a single Jellyfin user."
