name: google
label: Google (Gmail)
category: Google
setup_url: https://console.cloud.google.com/apis/credentials
setup_steps:
  - "Open the Google Cloud Console and create a project (or pick an existing one)."
  - "APIs & Services → Library → search \"Gmail API\" → Enable."
  - "APIs & Services → OAuth consent screen → User type External → fill app name + your email → Save."
  - "On the OAuth consent screen, add YOUR Gmail address under Test users (required while the app is unverified)."
  - "APIs & Services → Credentials → Create Credentials → OAuth client ID → Application type: Web application."
  - "Under Authorized redirect URIs, add {{redirect_uri}} exactly, then click Create."
  - "Copy the Client ID and Client secret and paste them below."
authorize_url: https://accounts.google.com/o/oauth2/v2/auth
token_url: https://oauth2.googleapis.com/token
userinfo_url: https://www.googleapis.com/oauth2/v2/userinfo
identity_path: email
# Capture the scope string the token endpoint returns, so Execute can tell an
# action's declared scopes apart from what this connection was actually GRANTED and
# say "reconnect to grant X" instead of surfacing an opaque 403. Costs no new
# machinery — token_extra already lands in service_connections.extra, and refresh
# never clears it. Declared on the PARENT so every auth_parent child inherits it.
token_extra: [scope]
authorize_extra:
  access_type: offline
  # "select_account consent" — prompt is a space-delimited list (OpenID Connect
  # Core 3.1.2.1). consent alone reuses whichever Google account is already
  # signed in, so connecting a SECOND account silently re-authorized the first
  # and multi-account was impossible in practice. select_account shows the
  # chooser; consent is retained because dropping it stops Google issuing a
  # refresh token on re-consent.
  prompt: select_account consent
  include_granted_scopes: "true"
default_scopes:
  - https://www.googleapis.com/auth/gmail.readonly
  - https://www.googleapis.com/auth/gmail.compose
  - https://www.googleapis.com/auth/gmail.send
  - https://www.googleapis.com/auth/gmail.modify
  # Filters, the vacation responder and the send-as alias list. An existing
  # connection does not hold this: Execute's scope pre-check names it and tells the
  # user to reconnect, rather than letting Google answer 403 with nothing in it.
  - https://www.googleapis.com/auth/gmail.settings.basic
  - https://www.googleapis.com/auth/userinfo.email

# Verified 2026-07-29 against
# https://developers.google.com/identity/protocols/oauth2/web-server and
# https://support.google.com/cloud/answer/15549257 — "Redirect URIs must use the
# HTTPS scheme… Localhost URIs are exempt", "Hosts cannot be raw IP addresses",
# and the domain must be a valid top private domain.
redirect_policy:
  scheme: https_or_loopback
  allow_raw_ip: loopback_only
  require_public_host: true
  verified: true
