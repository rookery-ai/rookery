name: openstreetmap
label: OpenStreetMap
category: Data & Reference
auth:
  kind: none
# Nominatim's usage policy REQUIRES an identifying User-Agent and blocks generic ones
# outright — the same trap Wikimedia sets.
static_headers:
  User-Agent: "Rookery/1.0 (https://rookery.sh; self-hosted personal assistant)"
setup_url: https://operations.osmfoundation.org/policies/nominatim/
setup_steps:
  - "OpenStreetMap needs no account and no API key — press Connect."
  - "This uses Nominatim for geocoding, which allows at most 1 request per second and forbids heavy or bulk use."
  - "Results are © OpenStreetMap contributors, licensed ODbL — an agent showing an address should credit them."
