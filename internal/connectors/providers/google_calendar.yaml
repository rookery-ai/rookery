name: google_calendar
label: Google Calendar
category: Google
# Not yet confirmed against the live API with cmd/livecheck — no credential
# was available at authoring time. Remove this once a real call succeeds.
unverified: true
auth_parent: google
default_scopes:
  - https://www.googleapis.com/auth/calendar.events
  - https://www.googleapis.com/auth/calendar.readonly
  # Creating or deleting a calendar, and reading or changing its sharing list, are
  # calendar-level rather than event-level operations and calendar.events does not
  # reach them. A connection made before this was added holds no grant for it;
  # Execute's scope pre-check names it rather than surfacing a bare 403.
  - https://www.googleapis.com/auth/calendar
setup_url: https://console.cloud.google.com/apis/credentials
setup_steps:
  - "Google Calendar reuses your Google (Gmail) OAuth app. Set up Google first on its card above."
  - "In Google Cloud Console, also enable the Google Calendar API."
  - "Then click Connect here to authorize Calendar access on the same Google account."
