name: wikipedia
label: Wikipedia
category: Data & Reference
auth:
  kind: none
# Wikimedia BLOCKS the default Go user-agent outright (403, citing their robot policy),
# so a descriptive one is mandatory rather than polite. Found by live verification —
# every action 403'd until this was set. See https://w.wiki/4wJS.
static_headers:
  User-Agent: "Rookery/1.0 (https://rookery.sh; self-hosted personal assistant)"
setup_url: https://www.mediawiki.org/wiki/API:REST_API
setup_steps:
  - "Wikipedia needs no account and no API key — press Connect."
  - "Content is licensed CC BY-SA; an agent quoting an article should say which one."
  - "Anonymous access is rate-limited, so prefer searching once and reading the result over repeated polling."
