name: sonarr
label: Sonarr
category: Self-hosted
unverified: true
auth:
  kind: api_key
  placement: header
  header_name: X-Api-Key
  value_prefix: ""
  key_label: "Sonarr API key"
  key_hint: "from Settings → General → Security"
  setup_url: https://wiki.servarr.com/sonarr/settings
connect_inputs:
  - key: base_url
    label: "Sonarr URL"
    hint: "e.g. http://sonarr.local:8989 — a LAN address is fine"
    required: true
    normalize: base_url
setup_steps:
  - "In Sonarr open Settings → General and scroll to the Security section."
  - "Copy the API Key shown there and enter it with your Sonarr URL below."
  - "The key grants full control of the instance — there is no read-only variant."
