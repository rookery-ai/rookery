name: jira
label: Jira (Atlassian)
setup_url: https://developer.atlassian.com/console/myapps/
setup_steps:
  - "Go to the Atlassian Developer Console → Create → OAuth 2.0 integration."
  - "Add the Jira API permission (Permissions → Jira API → Add) with read/write scopes."
  - "Authorization → OAuth 2.0 (3LO) → set the Callback URL to the redirect URI shown above exactly."
  - "Settings → copy the Client ID and generate/copy the Secret."
  - "Paste the Client ID and Secret below."
authorize_url: https://auth.atlassian.com/authorize
token_url: https://auth.atlassian.com/oauth/token
userinfo_url: https://api.atlassian.com/me
identity_path: email
post_connect: atlassian_cloudid
authorize_extra:
  audience: api.atlassian.com
  prompt: consent
default_scopes:
  - read:jira-work
  - write:jira-work
  - read:jira-user
  - offline_access
