name: portainer
label: Portainer
category: Self-hosted
unverified: true
auth:
  kind: api_key
  placement: header
  header_name: X-API-Key
  value_prefix: ""
  key_label: "Portainer access token"
  key_hint: "ptr_... — from My account → Access tokens"
  setup_url: https://docs.portainer.io/api/access
connect_inputs:
  - key: base_url
    label: "Portainer URL"
    hint: "e.g. https://portainer.local:9443"
    required: true
    normalize: base_url
setup_steps:
  - "In Portainer open My account → Access tokens and add a token."
  - "Copy it and enter it with your Portainer URL below."
  - "The token inherits your user's permissions — use a restricted account if the agent only needs to read."
