name: meta_ads
label: Meta Ads
category: Advertising
authorize_url: https://www.facebook.com/v21.0/dialog/oauth
token_url: https://graph.facebook.com/v21.0/oauth/access_token
userinfo_url: https://graph.facebook.com/v21.0/me
identity_path: name
# Meta issues NO refresh token: a short-lived token is swapped for a ~60-day one via the
# fb_exchange_token grant, and renewed by exchanging the current token again.
token_expiry: exchange
default_scopes:
  - ads_read
  - ads_management
setup_url: https://developers.facebook.com/apps
setup_steps:
  - "Go to Meta for Developers → My Apps → Create App → type 'Business'."
  - "Add the 'Facebook Login for Business' product, and under its Settings add {{redirect_uri}} exactly."
  - "In App settings → Basic, copy the App ID and App Secret and paste them below."
  - "Keep the app in DEVELOPMENT mode: it then has full access to ad accounts YOU have a role on, with no App Review. App Review is only needed to reach other businesses' accounts."
  - "Make sure your Facebook user is an admin of the ad account you want to read."
