name: lidarr
label: Lidarr
category: Self-hosted
unverified: true
auth:
  kind: api_key
  placement: header
  header_name: X-Api-Key
  value_prefix: ""
  key_label: "Lidarr API key"
  key_hint: "from Settings → General → Security"
  setup_url: https://wiki.servarr.com/lidarr
connect_inputs:
  - key: base_url
    label: "Lidarr URL"
    hint: "e.g. http://lidarr.local:8686 — a LAN address is fine"
    required: true
    normalize: base_url
setup_steps:
  - "In Lidarr open Settings → General and scroll to the Security section."
  - "Copy the API Key shown there."
  - "Paste it below with your Lidarr URL. A private address such as http://192.168.1.10:8686 works: connectors reach your own network on purpose."
