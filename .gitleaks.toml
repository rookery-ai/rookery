# gitleaks configuration.
#
# The default ruleset is kept in full — this file only adds narrowly-scoped
# allowlist entries for confirmed false positives. Never broaden an entry to a
# whole path or rule: a secret scanner that has been taught to ignore a
# directory stops being a secret scanner for that directory.

[extend]
useDefault = true

[[allowlists]]
description = """
The generic-api-key rule fires on Go IDENTIFIERS whose names contain
"secret"/"key" when they sit to the right of a colon, because the heuristic
reads `SecretKeySet: c.S3.EncryptedSecretKey` as key-then-value and scores the
expression's entropy (3.53) as credential-like.

`EncryptedSecretKey` is a struct FIELD holding an already-encrypted value at
rest, and `SecretKeySet` is a bool reporting only WHETHER one is configured —
the backup API deliberately never returns the value itself. Matching on the
exact expression keeps this to those identifiers: a real credential assigned
anywhere, including in these same files, is still reported.
"""
regexTarget = "secret"
regexes = [
  '''^c\.S3\.EncryptedSecretKey$''',
  '''^cfg\.S3\.EncryptedSecretKey$''',
]
