# Every Dependabot PR runs the full 11-job gate, including an ~8-minute
# `go test -race` and a container build. On a PRIVATE repo those are metered
# Actions minutes, and the first run opened ten PRs at once (~110 jobs). So each
# ecosystem is GROUPED into a single PR and capped — one PR per ecosystem per
# week costs a fraction of that and is easier to review than ten one-line bumps.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The tiptap editor ships as a dozen coordinated packages; separate PRs
      # for each would conflict with one another on every bump.
      tiptap:
        patterns: ["@tiptap/*"]
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      # MAJOR action bumps land in their own PR: they are the ones that actually
      # break a workflow (gitleaks v2→v3 changes its licensing model, and this
      # pipeline was already bitten by a nonexistent action tag), so they should
      # not ride along with routine patches.
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Node ships an LTS line on EVEN majors only. Odd majors (25, 27, …) are
      # the "Current" line: they go end-of-life about six months after release
      # and never become LTS. `node:` here builds the SPA for the image we
      # actually ship, and `.nvmrc` pins the same major for CI — so following
      # Dependabot onto an odd major would put the release image on an
      # unsupported runtime AND split it from the version CI builds with, for a
      # bump whose green checks say nothing about either. Both failures are
      # invisible in a passing PR, which is why this is a standing rule rather
      # than a per-PR judgement call (declined once already as #84, node 24→25).
      # Bump this BY HAND to the next EVEN major once it reaches Active LTS,
      # updating `.nvmrc` in the same commit.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
