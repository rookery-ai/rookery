# Every Dependabot PR runs the full 11-job gate, including an ~8-minute
# `go test -race` and a container build. On a PRIVATE repo those are metered
# Actions minutes, and the first run opened ten PRs at once (~110 jobs). So each
# ecosystem is GROUPED into a single PR and capped — one PR per ecosystem per
# week costs a fraction of that and is easier to review than ten one-line bumps.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The tiptap editor ships as a dozen coordinated packages; separate PRs
      # for each would conflict with one another on every bump.
      tiptap:
        patterns: ["@tiptap/*"]
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      # MAJOR action bumps land in their own PR: they are the ones that actually
      # break a workflow (this pipeline was already bitten by a nonexistent
      # action tag), so they should not ride along with routine patches.
      #
      # A correction, because the earlier note here was wrong and steered us
      # away from a fix we needed: gitleaks v2→v3 does NOT change its licensing
      # model. v3 is a Node 20→24 runtime bump with explicitly no change to
      # inputs, outputs or behaviour — and v2 stops working entirely once
      # GitHub removes Node 20 from hosted runners on 2026-09-16.
      #
      # That deadline is why `open-pull-requests-limit` deserves an eye: it is
      # a CAP, not a queue. The five major bumps already open filled it, so
      # Dependabot never proposed the node24 majors for build-push-action,
      # metadata-action, goreleaser-action or release-please-action — all four
      # were still on the dead runtime and had to be found by auditing every
      # action's `runs.using` by hand. A silent cap is not the same as
      # "nothing to update".
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
