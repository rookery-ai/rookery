version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /web/ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # The tiptap editor ships as a dozen coordinated packages; separate PRs for
    # each would conflict with one another on every bump.
    groups:
      tiptap:
        patterns: ["@tiptap/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
