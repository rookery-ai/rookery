name: release-please

# Maintains a release pull request on main, accumulating Conventional Commits
# and computing the next semantic version. Merging that PR creates the tag,
# which fires release.yml.
#
# Chosen over semantic-release specifically because it releases THROUGH a merged
# PR; semantic-release pushes tags directly from CI, which would violate the
# project rule that main only ever advances through merged PRs.
on:
  push:
    branches: [main]
  # Manual trigger, for re-running after a credential or configuration change
  # without having to land a no-op commit on main. release-please is idempotent:
  # it updates its existing release PR rather than opening a second one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # An organization-owned GitHub App, for two separate reasons — both easy
      # to "simplify" away, and each breaks something different:
      #
      #   NOT GITHUB_TOKEN: a pull request opened with it does not trigger other
      #   workflows, so merging the release PR would create a tag that
      #   release.yml never sees — a tag with no artifacts attached and no error
      #   explaining why.
      #
      #   NOT a PAT: GitHub has no org-owned PAT. Every PAT belongs to a user
      #   account; a fine-grained one merely SCOPES to an org while still being
      #   that person's, expiring on a calendar and dying if they leave. The App
      #   is owned by the org and mints a short-lived installation token per run.
      #
      # See docs/ci-setup.md §1.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.ROOKERY_APP_ID }}
          private-key: ${{ secrets.ROOKERY_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
