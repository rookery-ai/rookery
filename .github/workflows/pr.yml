name: PR

on:
  pull_request:
    branches: [main]

# A force-push should not leave the previous run burning minutes.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-lint:
    name: Conventional commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # The PR TITLE is linted rather than individual commits because merges are
      # squashes: the title becomes the commit that lands on main and the input
      # release-please reads to compute the next version.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            build
            ci
          requireScope: false

  go:
    name: Go build and test
    runs-on: ubuntu-latest
    # Measured at ~8 min wall with -race (the web package alone is ~6 min).
    # The cap exists so a hung test fails in minutes instead of burning hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # python3 is present on ubuntu-latest, which matters: the AST guardrail
      # tests self-skip without it, and a silently skipped security test is
      # worse than a failing one.
      - name: Verify python3 is available
        run: python3 --version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^\.claude/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race is the point of this job: the scheduler, gateway manager and
      # connector bridge all run concurrent goroutines against shared state.
      # 900s per test binary, not 600s — the web package measures ~343s locally
      # under -race and a slower runner needs the headroom.
      - name: go test -race
        run: go test ./... -race -count=1 -timeout 900s

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # This matrix is the regression guard for the build-tagged setProcGroup
      # helper. GOOS=windows was broken for the project's entire history because
      # nothing ever compiled it.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/rookery

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # gitleaks lists the PR's commits to scan only what the PR adds, which
      # needs pull-requests: read — without it the API returns 403 "Resource not
      # accessible by integration". contents: read must be restated because a
      # job-level block REPLACES the workflow-level one instead of merging.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks diffs from the PR's first commit's PARENT to its head, so a
          # shallow clone makes those revisions unknown and the scan aborts with
          # "ambiguous argument". Full history is the documented requirement.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck is call-graph aware: it reports only vulnerabilities in code
      # paths the binary actually reaches, so it is far less noisy than a
      # manifest-level scanner and worth failing the build on. Verified clean
      # against this tree before the workflow was added.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Trivy in filesystem mode covers the npm tree and Go modules. Ignore
      # unfixed findings: failing on a CVE with no available patch blocks work
      # nobody can unblock.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Config comes from .gitleaks.toml at the repo root, which gitleaks
      # auto-discovers from --source. There is deliberately no GITLEAKS_CONFIG
      # here: this action builds its own argv (`detect --redact -v
      # --exit-code=2 …`) and passes no --config, and it never reads that
      # variable — setting it looks like it configures something and does not.
      # See src/gitleaks.js in gitleaks/gitleaks-action.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Single-arch and loaded locally: this job proves the image RUNS, which a
      # multi-arch build cannot do (you cannot start an arm64 container here
      # without emulation). The multi-arch build happens at release.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rookery:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image mode complements the filesystem scan in the security job: that one
      # sees source manifests, this one sees the Debian base layer and the
      # apt-installed runtime (python3, ripgrep, poppler, tesseract), which no
      # source scan can reach.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: rookery:pr
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The project's only end-to-end coverage: a real binary, in a real image,
      # actually serving. Also fails if the image ever loses ROOKERY_CODER_MODE=slim,
      # which would advertise CLI coders it does not contain.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name rookery-smoke -p 18080:8080 rookery:pr

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            if [ "$i" = "45" ]; then
              echo "::error::server never became healthy"
              docker logs rookery-smoke
              exit 1
            fi
            sleep 1
          done

          body="$(curl -fsS http://127.0.0.1:18080/healthz)"
          echo "healthz: $body"

          echo "$body" | grep -q '"status":"ok"' \
            || { echo "::error::status not ok"; exit 1; }
          echo "$body" | grep -q '"coder_mode":"slim"' \
            || { echo "::error::image is missing ROOKERY_CODER_MODE=slim"; exit 1; }
          # The image installs all four; a missing one means a broken base layer.
          echo "$body" | grep -q '"python3":true' \
            || { echo "::error::python3 absent — the AST guardrail would be inactive"; exit 1; }

          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)"
          [ "$code" = "200" ] || { echo "::error::SPA root returned $code, want 200"; exit 1; }

          sess="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/auth/session)"
          [ "$sess" = "200" ] || { echo "::error::session endpoint returned $sess, want 200"; exit 1; }

          docker exec rookery-smoke /usr/bin/rookery healthcheck
          docker rm -f rookery-smoke

  packages:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser reads tags to compute the snapshot version

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      # A snapshot needs no tag and exercises the same builds/nfpm config the
      # release uses. Signing and SBOMs are release-only concerns.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=sign,sbom

      # Installs each artifact in a throwaway container and actually runs it.
      # Nothing in CI had ever done this, which is why the deb, rpm and every
      # archive shipped unable to open their own database.
      - name: Smoke test the packages
        env:
          CONTAINER_ENGINE: docker
        run: scripts/smoke-package.sh dist
